<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recipe Planner & Meal Organizer</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="brand">
        <i class="fa-solid fa-utensils"></i>
        <span>Smart Recipe Planner</span>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('recipes', event)"><i class="fa-solid fa-book-open"></i> Recipes</button>
        <button class="tab-btn" onclick="switchTab('planner', event)"><i class="fa-solid fa-calendar-days"></i> Planner</button>
        <button class="tab-btn" onclick="switchTab('shopping', event)"><i class="fa-solid fa-basket-shopping"></i> Shopping</button>
    </div>
</header>

<div class="container">

    <!-- TAB 1: RECIPES SECTION -->
    <section id="recipes-view" class="view-section active">
        
        <div class="card-box" style="padding: 20px 28px;">
            <div class="form-grid">
                <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="🔍 Search saved recipes by name...">
                <select id="filterDiet" onchange="filterRecipes()">
                    <option value="All">All Diets</option>
                    <option value="Veg">Vegetarian</option>
                    <option value="Non-Veg">Non-Vegetarian</option>
                    <option value="Vegan">Vegan</option>
                </select>
            </div>
        </div>

        <!-- Recipe Generator Card -->
        <div class="card-box generator-card">
            <h2><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary);"></i> Recipe Generator</h2>
            <div class="form-grid">
                <input type="text" id="findIngredientsInput" class="full-width" placeholder="Enter ingredients available with you (e.g. paneer, tomato, onion)">
                <button type="button" class="btn-submit" onclick="generateFromDatabase()">
                    <i class="fa-solid fa-bolt"></i> Generate Recipe
                </button>
            </div>
            <div id="foundRecipesArea" style="margin-top: 20px; display: grid; gap: 14px;"></div>
        </div>

        <div class="card-box">
            <h2><i class="fa-solid fa-circle-plus" style="color: var(--primary);"></i> Add New Recipe</h2>
            <form id="recipeForm">
                <div class="form-grid">
                    <input type="text" id="recipeName" placeholder="Recipe Name" required>
                    
                    <select id="dietPref" required>
                        <option value="" disabled selected>Dietary Preference</option>
                        <option value="Veg">Vegetarian</option>
                        <option value="Non-Veg">Non-Vegetarian</option>
                        <option value="Vegan">Vegan</option>
                    </select>

                    <input type="text" id="cuisine" placeholder="Cuisine (e.g. Indian)" required>
                    <input type="number" id="prepTime" min="1" step="1" placeholder="Prep Time (Minutes)" required>

                    <select id="mealType" required>
                        <option value="" disabled selected>Meal Category</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>

                    <input type="number" id="calories" min="1" placeholder="Calories (kcal)" required>
                    <input type="text" id="macros" placeholder="Macros (e.g. P: 20g, C: 40g, F: 12g)">

                    <textarea id="ingredients" class="full-width" rows="2" placeholder="Ingredients (Comma separated: 200g paneer, 2 tomatoes, 1 onion)" required></textarea>
                    <textarea id="instructions" class="full-width" rows="3" placeholder="Cooking Steps (Period separated: Chop vegetables. Heat oil. Cook paneer.)" required></textarea>
                </div>
                <br>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-floppy-disk"></i> Save Recipe
                </button>
            </form>
        </div>

        <h2 style="font-size: 1.4rem; margin-bottom: 22px;"><i class="fa-solid fa-book-bookmark" style="color: var(--primary);"></i> Saved Recipes</h2>
        <div class="recipes-grid" id="recipeCards"></div>
    </section>

    <!-- TAB 2: WEEKLY MEAL PLANNER -->
    <section id="planner-view" class="view-section">
        <div class="card-box">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <h2><i class="fa-solid fa-calendar-plus" style="color: var(--primary);"></i> Assign Meal to Schedule</h2>
                <button class="btn-submit btn-secondary" style="color: #ff3b5c; border-color: rgba(255, 59, 92, 0.3);" onclick="clearFullPlan()">
                    <i class="fa-solid fa-trash-arrow-up"></i> Reset Week Schedule
                </button>
            </div>
            <br>
            <div class="form-grid">
                <select id="planDay">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>

                <select id="planRecipe"></select>

                <button class="btn-submit" onclick="addToPlan()">
                    <i class="fa-solid fa-plus"></i> Add to Weekly Plan
                </button>
            </div>
        </div>

        <div class="planner-grid" id="weeklyCalendar"></div>
    </section>

    <!-- TAB 3: AUTOMATED SHOPPING LIST -->
    <section id="shopping-view" class="view-section">
        <div class="card-box">
            <h2><i class="fa-solid fa-cart-flatbed" style="color: var(--primary);"></i> Automated Shopping List</h2>
            
            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 25px; flex-wrap: wrap;">
                <button class="btn-submit btn-whatsapp" onclick="shareWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp Share
                </button>
                
                <button class="btn-submit btn-secondary" onclick="copyShoppingList()">
                    <i class="fa-regular fa-copy"></i> Copy List
                </button>

                <button class="btn-submit btn-secondary" onclick="downloadTxtList()">
                    <i class="fa-solid fa-download"></i> Download .TXT
                </button>
            </div>

            <ul class="shopping-list" id="shoppingList"></ul>
        </div>
    </section>

</div>

<!-- COOKING MODE MODAL WITH AUDIO -->
<div class="modal" id="cookingModal">
    <div class="modal-content">
        <h2 id="modalRecipeTitle">Cooking Mode</h2>
        
        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; text-align: center; margin: 20px 0; border: 1px solid var(--border);">
            <div style="font-size: 2.8rem; font-weight: 800; color: var(--primary);" id="timerDisplay">00:00</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
                <button class="btn-submit" style="padding: 10px 20px;" onclick="startTimer()"><i class="fa-solid fa-play"></i> Start Timer</button>
                <button class="btn-submit btn-secondary" style="padding: 10px 20px;" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            </div>
        </div>
        
        <h3 style="margin-bottom:12px; color: var(--primary);">Interactive Cooking Steps:</h3>
        <div id="modalSteps"></div>
        <br>
        <button class="btn-submit btn-secondary" style="width:100%;" onclick="closeModal()">Close Cooking Mode</button>
    </div>
</div>

<!-- Custom JavaScript -->
<script src="script.js"></script>
</body>
</html>
